<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>

  <!-- Montserrat font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- My own CSS (loaded AFTER Bootstrap so it can override it) -->
  <link href="css/task1.css" rel="stylesheet">
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">

          <form class="ticket-card" action="#" method="get" aria-labelledby="form-title">

            <header class="ticket-card__header">
              <h1 id="form-title" class="ticket-card__title">Book a train ticket</h1>
            </header>

            <div class="ticket-card__body">

              <!-- 1. Trip type: two radio inputs shown as a Bootstrap button group (.btn-check) -->
              <fieldset class="mb-4">
                <legend class="visually-hidden">Trip type</legend>
                <div class="btn-group trip-switch" role="group" aria-label="Trip type">
                  <input type="radio" class="btn-check" name="trip" id="trip-one" value="one-way" required checked>
                  <label class="btn trip-switch__btn" for="trip-one">One way</label>

                  <input type="radio" class="btn-check" name="trip" id="trip-round" value="round-trip" required>
                  <label class="btn trip-switch__btn" for="trip-round">Round trip</label>
                </div>
              </fieldset>

              <div class="row g-3">

                <!-- 2. From / To: floating labels -->
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="from" name="from" placeholder="Astana" autocomplete="off" required>
                    <label for="from">From</label>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" autocomplete="off" required>
                    <label for="to">To</label>
                  </div>
                </div>

                <!-- 3. Departure / Return / Passengers: date inputs and select -->
                <div class="col-12 col-md-4">
                  <label for="departure" class="form-label">Departure</label>
                  <input type="date" class="form-control" id="departure" name="departure" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="return" class="form-label">Return</label>
                  <input type="date" class="form-control" id="return" name="return">
                </div>
                <div class="col-12 col-md-4">
                  <label for="passengers" class="form-label">Passengers</label>
                  <select class="form-select" id="passengers" name="passengers">
                    <option value="1" selected>1 adult</option>
                    <option value="2">2 adults</option>
                    <option value="3">3 adults</option>
                    <option value="4">4 adults</option>
                    <option value="5">5 adults</option>
                    <option value="6">6 adults</option>
                  </select>
                </div>

                <!-- 4. Carriage class: inline radio buttons -->
                <div class="col-12">
                  <fieldset>
                    <legend class="form-label">Carriage class</legend>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="car-seat" value="seat" required>
                      <label class="form-check-label" for="car-seat">Seat</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="car-coupe" value="coupe" required checked>
                      <label class="form-check-label" for="car-coupe">Coupé</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="car-sleeper" value="sleeper" required>
                      <label class="form-check-label" for="car-sleeper">Sleeper</label>
                    </div>
                  </fieldset>
                </div>

                <!-- 5. Phone: input group with a "+7" prefix; Email -->
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label">Phone</label>
                  <div class="input-group">
                    <span class="input-group-text" id="phone-prefix">+7</span>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78"
                           inputmode="tel" autocomplete="tel" aria-describedby="phone-prefix"
                           pattern="[0-9 ]{10,13}" title="10 digits, for example 701 234 56 78" required>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                </div>

                <!-- 6. Switch and checkbox -->
                <div class="col-12">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
                    <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agree" name="agree" value="yes" required>
                    <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                  </div>
                </div>

                <!-- 7. Buttons. HTML order: Clear, Find trains.
                        Phone: flex-column-reverse puts "Find trains" on top (no HTML change).
                        Laptop: flex-sm-row-reverse is NOT used, so the order stays Clear → Find trains. -->
                <div class="col-12">
                  <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 mt-2">
                    <button type="reset" class="btn btn-clear">Clear</button>
                    <button type="submit" class="btn btn-find">Find trains</button>
                  </div>
                </div>

              </div><!-- /.row -->
            </div><!-- /.ticket-card__body -->
          </form>

        </div>
      </div>
    </div>
  </main>
</body>
</html>
